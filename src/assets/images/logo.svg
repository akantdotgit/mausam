<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <!-- Sun Graphic -->
  <g transform="translate(60, 60)">
    <!-- Central Ring/Circle -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#FF7A00" stroke-width="12" />

    <!-- Sun Rays -->
    <g fill="#FF7A00">
      <!-- 12 evenly distributed rays -->
      <rect x="-4" y="-48" width="8" height="18" rx="2" transform="rotate(0)" />
      <rect x="-4" y="-48" width="8" height="18" rx="2" transform="rotate(30)" />
      <rect x="-4" y="-48" width="8" height="18" rx="2" transform="rotate(60)" />
      <rect x="-4" y="-48" width="8" height="18" rx="2" transform="rotate(90)" />
      <rect x="-4" y="-48" width="8" height="18" rx="2" transform="rotate(120)" />
      <rect x="-4" y="-48" width="8" height="18" rx="2" transform="rotate(150)" />
      <rect x="-4" y="-48" width="8" height="18" rx="2" transform="rotate(180)" />
      <rect x="-4" y="-48" width="8" height="18" rx="2" transform="rotate(210)" />
      <rect x="-4" y="-48" width="8" height="18" rx="2" transform="rotate(240)" />
      <rect x="-4" y="-48" width="8" height="18" rx="2" transform="rotate(270)" />
      <rect x="-4" y="-48" width="8" height="18" rx="2" transform="rotate(300)" />
      <rect x="-4" y="-48" width="8" height="18" rx="2" transform="rotate(330)" />
    </g>
  </g>

  <!-- Text: Mausam -->
  <text x="135" y="78" fill="#FFFFFF" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="0.5">Mausam</text>
</svg>
